# gochess as a Lichess bot.
#
# This file contains no secret. Export the OAuth token before starting:
#
#   export LICHESS_BOT_TOKEN="lip_..."
#
# Create a token with the bot:play scope at
# https://lichess.org/account/oauth/token/create?scopes[]=bot:play
#
# The paths below assume run.sh starts lichess-bot from
# tools/lichess/lichess-bot, so ../../.. is the repository root.
token: ""
url: "https://lichess.org/"

engine:
  dir: "../../.."
  name: "gochess"
  protocol: "uci"
  ponder: true           # python-chess sets the engine's Ponder option per move
  working_dir: ""
  debug: false
  uci_options:
    # Only list options gochess advertises. python-chess rejects unknown UCI
    # options, so SyzygyPath/UCI_ShowWDL from the stock config must stay out.
    # 256 MB, deliberately above the 128 MB sweet spot so the table does not
    # fill in middlegames. With two simultaneous games this is 512 MB total.
    Hash: 256
    Threads: 1
    Move Overhead: 100
    go_commands:
      # This is a ceiling, not a fixed search: gochess still uses the clock
      # budget when less than 5s remains, so a final mate in one is played
      # instead of flagging. With a healthy clock it gives more nodes per move.
      movetime: 5000
  draw_or_resign:
    # gochess's evaluation is too rough to resign or offer draws on.
    resign_enabled: false
    offer_draw_enabled: false

# Chat. lichess-bot sends `hello` with the bot's first move and `goodbye` when
# the game ends. `{me}` and `{opponent}` expand to the account names; any other
# `{...}` is removed. An empty string stays silent. Lichess caps a message at
# 140 characters. Spectator chat is a separate pair of keys and stays off.
greeting:
  hello: "Hi {opponent}! I'm {me}, a small chess engine written in Go. Good luck!"
  goodbye: "gg! Thanks for the game."

abort_time: 30
move_overhead: 300       # lichess-bot's clock reserve, on top of gochess's 100 ms
quit_after_all_games_finish: true
pgn_directory: "../games"
pgn_file_grouping: "game"

challenge:
  # Two slots: one reserved for casual human challenges, one for rated bot
  # matchmaking. Humans can find the bot at https://lichess.org/@/gochess6767.
  concurrency: 2
  games_reserved_for_humans: 1
  accept_bot: true
  only_bot: false
  preference: "human"
  variants:
    - standard
  time_controls:
    - bullet
    - blitz
    - rapid
  modes:
    # Lichess only offers humans casual challenges against bots; rated stays
    # enabled so bot-vs-bot matchmaking can still affect the rating.
    - casual
    - rated
  min_base: 60           # 1 minute; accepts bullet through 10-minute rapid
  max_base: 600          # 10 minutes, to keep games moving
  max_increment: 10
  # No minimum increment any more. The clock-aware movetime ceiling scales the
  # search down when time is short, so 3+0/5+0/10+0 are accepted too. Bullet
  # games can still be tight at 1+0; raise min_base if flags become common.
  min_increment: 0
  # Follow the bot's rating instead of a fixed band. New bots start at 3000,
  # so this begins at 2000-4000 and follows the rating down as it loses.
  rating_difference: 1000
  max_simultaneous_games_per_user: 1

matchmaking:
  allow_matchmaking: true
  allow_during_games: false
  # Lichess caps bot-vs-bot games at 100/day. This one-minute idle timeout will
  # use that allowance; lichess-bot prints a warning about it during setup.
  challenge_timeout: 1   # minutes idle before challenging another bot
  challenge_variant: "standard"
  challenge_mode: "rated"
  challenge_initial_time:
    - 180                # 3+2
    - 300                # 5+2
  challenge_increment:
    - 2
  # Outgoing challenges stay closer to the bot's rating. A 1000-point band kept
  # picking 2500+ bots that decline; 400 still includes the useful 1200-1900
  # range. Incoming challenges keep the wider band above.
  opponent_rating_difference: 400
  # Weight the draw toward the top of the band. lichess-bot's weight is
  # `rating - 593`, so a bot at the top (~2196) is 2x as likely to be picked as
  # one at the bottom (~1396). Measured over the live pool (406 bots online,
  # 157 in band) the mean opponent moves from ~1820 to ~1860 and the 1900+ share
  # of challenges goes from ~37% to ~44%. That is a nudge, not a filter: the
  # weak end stays reachable (the bot scores ~95% below 1500).
  # Set back to "none" for a flat distribution, or "low" to bias the other way.
  # For a real floor, drop opponent_rating_difference (it takes precedence) and
  # set opponent_min_rating/opponent_max_rating instead.
  rating_preference: "high"
