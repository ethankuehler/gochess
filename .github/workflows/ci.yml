name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files are not gofmt'd:"
            echo "$files"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Test with search metrics
        run: go test -tags metrics -race ./...

      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish

      - name: Perft against Stockfish
        env:
          STOCKFISH_BIN: /usr/games/stockfish
        run: go test -count=1 -timeout 5m ./chess -run '^TestPerftAgainstStockfish$' -v

      - name: Match against Stockfish
        env:
          STOCKFISH_BIN: /usr/games/stockfish
        run: go test -count=1 -timeout 5m ./cmd/match -run '^TestMatchAgainstStockfish$' -v

      - name: UCI smoke test
        run: |
          go build -o gochess ./cmd/uci
          ./gochess bench 4
          ./gochess -version

      - name: Cross-compile UCI
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/gochess.exe ./cmd/uci
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/gochess-darwin ./cmd/uci
